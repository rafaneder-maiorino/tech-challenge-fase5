[project]
name = "support-copilot"
version = "0.1.0"
description = "Hybrid support copilot: ticket triage, RAG with guardrails and drift monitoring (FIAP MLET Phase 5 Datathon)"
readme = "README.md"
authors = [
    { name = "Rafael Neder Maiorino", email = "rafaneder@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
support-copilot = "support_copilot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "LOG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains real models end to end (seconds)"]
